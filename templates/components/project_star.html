<form method="post" action="{% url 'main:toggle_star' project.pk %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if project.is_starred %} is-starred{% endif %}"
            title="{% if project.star_count %}Starred by {{ project.starred_by_names }}{% else %}Be the first to star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if project.is_starred %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ project.star_count }}</span>
    </button>
</form>
