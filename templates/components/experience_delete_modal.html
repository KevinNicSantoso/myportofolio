<div class="project-delete-modal" popover id="delete-experience-modal-{{ experience.id }}">
    <button class="project-delete-modal__backdrop"
            popovertarget="delete-experience-modal-{{ experience.id }}"></button>
    <div class="project-delete-modal__content">
        <button class="project-delete-modal__close"
                popovertarget="delete-experience-modal-{{ experience.id }}"
                aria-label="Tutup">&times;</button>
        <h2>Delete Experience</h2>
        <p>Are you sure you want to delete <strong>{{ experience.title }}</strong>?</p>
        <form method="POST" action="{% url 'main:delete_experience' experience.id %}">
            {% csrf_token %}
            <div class="project-delete-modal__actions">
                <button type="button" class="button button-secondary"
                        popovertarget="delete-experience-modal-{{ experience.id }}">Cancel</button>
                <button type="submit" class="button">Delete</button>
            </div>
        </form>
    </div>
</div>
